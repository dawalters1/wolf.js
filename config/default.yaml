
framework:
  commandKey: 098984a71d03bae4079c602344a52e09920001ca73

  charms:
    unofficial:
      - 813
      - 814

  connection:
    host: https://v3-rc.palringo.com
    port: 443
    query:
      device: wjsframework
    mocha:
      email: null
      password: null
    requests:
      retryCodes:
        - 500
        - 502
        - 503
        - 504
        - 408
      attempts: 3
      essential:
        - message group subscribe
        - message private subscribe
        - security login
        - security logout

  avatar:
    placeholder: >-
      https://d1gymp1zkvlptp.cloudfront.net/profiles/avatars/{type}/placeholder_{lastNumOfId}.jpg

  batching:
    length: 50

  multimedia:
    event:
      method: post
      route: group-event-image-update
      version: 1
      mimes:
        - type: image/jpeg
          size: 1048576
      square: false
    messaging:
      method: post
      route: send-message
      version: 1
      mimes:
        - type: image/jpeg
          size: 1048576
        - type: image/gif
          size: 3145728
        - type: audio/x-m4a
          size: 1048576
        - type: audio/mp4
          size: 1048576
      square: false
    avatar:
      user:
        method: post
        route: subscriber-avatar-update
        version: 1
        mimes:
          - type: image/jpeg
            size: 1048576
          - type: image/gif
            size: 2621440
            minLevel: 20
        square: true
      channel:
        method: post
        route: group-avatar-update
        version: 1
        mimes:
          - type: image/jpeg
            size: 1048576 
          - type: image/gif
            size: 2621440
            minLevel: 20
        square: true

  helper:
    channel:
      member:
        list:
          privileged:
            key: 'id'
            version: 3
            subscribe: true 
          regular:
            key: 'id'
            version: 1
            batchType: after
            subscribe: true 
          bots:
            key: 'groupId'
            version: 1
            batchType: offset
          silenced:
            key: 'groupId'
            version: 1
            batchType: offset
          banned:
            key: 'id'
            version: 1
            batchType: after

  subscriptions:
    channel:
      list: true
    tipping:
      channel: true
      private: false
    notification:
      user: false
      global: false
    messaging:
      private: true
      channel: true

  commands:
    phrases: true
    language: en
    ignore:
      self: true
      official: false
      unofficial: false

  messages:
    ignore:
      self: true
      official: false
      unofficial: true

log_level: 'debug'